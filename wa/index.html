<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empire Motors Kazakhstan — открываем WhatsApp</title>
<meta name="theme-color" content="#E9E7E3">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236E1E2A'/><text x='50' y='70' font-size='60' font-family='Arial Black,Arial' font-weight='900' text-anchor='middle' fill='%23E9E7E3'>E</text></svg>">
<script>
/* Диплинк: пытаемся открыть WhatsApp сразу, до загрузки остальной страницы */
(function () {
  var PHONE = "77055557372";
  var WA_WEB = "https://wa.me/" + PHONE;
  var WA_SCHEME = "whatsapp://send?phone=" + PHONE;
  // Без package: Android сам выберет WhatsApp или WhatsApp Business
  var WA_INTENT = "intent://send?phone=" + PHONE +
    "#Intent;scheme=whatsapp;S.browser_fallback_url=" + encodeURIComponent(WA_WEB) + ";end";

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var inApp = /BytedanceWebview|musical_ly|trill|TikTok|Instagram|FBAN|FBAV/i.test(ua);
  var here = location.host + location.pathname;

  window.__wa = {
    phone: PHONE, web: WA_WEB, scheme: WA_SCHEME, intent: WA_INTENT,
    isAndroid: isAndroid, isIOS: isIOS, inApp: inApp,
    escapeAndroid: "intent://" + here + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
      encodeURIComponent("https://" + here) + ";end",
    escapeIOS: "x-safari-https://" + here
  };

  var left = false;
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") left = true;
  });
  window.addEventListener("pagehide", function () { left = true; });

  function go(url) { try { window.location.href = url; } catch (e) {} }

  // Шаг 1: сразу открыть WhatsApp
  if (isAndroid) go(WA_INTENT);
  else if (isIOS) go(WA_SCHEME);
  else { go(WA_WEB); return; }

  // Шаг 2: если WhatsApp не открылся во встроенном браузере, выйти в Chrome или Safari.
  // Там эта же страница откроется заново и уже сможет открыть WhatsApp.
  if (inApp) {
    setTimeout(function () {
      if (!left && document.visibilityState === "visible") {
        go(isAndroid ? window.__wa.escapeAndroid : window.__wa.escapeIOS);
      }
    }, 1200);
  }
})();
</script>
<style>
  :root {
    --concrete: #E9E7E3;
    --concrete-deep: #DCD9D3;
    --graphite: #1E2226;
    --graphite-soft: #5A5F66;
    --burgundy: #6E1E2A;
    --burgundy-press: #561620;
    --brass: #A8844E;
    --wa: #25D366;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--concrete);
    color: var(--graphite);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 40px 24px 28px;
    display: flex;
    flex-direction: column;
  }
  .mark { margin: 0; }
  .mark-empire {
    display: block;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(52px, 18vw, 92px);
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--burgundy);
  }
  .mark-rest {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 2px solid var(--brass);
    font-weight: 700;
    font-size: clamp(14px, 4.4vw, 19px);
    letter-spacing: 0.06em;
  }
  .status { margin: 44px 0 0; font-size: 20px; }
  .actions { margin-top: 24px; display: grid; gap: 12px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 60px;
    padding: 14px 20px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 700;
    font-size: 18px;
  }
  .btn-wa { background: var(--burgundy); color: #fff; }
  .btn-wa:hover { background: var(--burgundy-press); }
  .btn:focus-visible, .copy-btn:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  .wa-icon {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--wa); display: grid; place-items: center;
  }
  .wa-icon svg { width: 18px; height: 18px; fill: #fff; }
  .phone-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 12px 12px 18px; border-radius: 14px; background: var(--concrete-deep);
  }
  .phone { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .copy-btn {
    flex: none; border: 1.5px solid var(--graphite); background: transparent; color: var(--graphite);
    font: inherit; font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  }
  .copy-btn[data-done="true"] { border-color: var(--burgundy); color: var(--burgundy); }
  .note { margin: 16px 0 0; font-size: 15px; color: var(--graphite-soft); }
  .dots { padding: 0 6px; border-radius: 6px; background: var(--concrete-deep); font-weight: 700; color: var(--graphite); }
  .hidden { display: none; }
</style>
</head>
<body>
  <main class="page">
    <h1 class="mark">
      <span class="mark-empire">EMPIRE</span>
      <span class="mark-rest"><span>MOTORS</span><span>KAZAKHSTAN</span></span>
    </h1>

    <p class="status" role="status">Открываем WhatsApp…</p>

    <div class="actions">
      <a id="wa-btn" class="btn btn-wa" href="https://wa.me/77055557372">
        <span class="wa-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.02c-.24.68-1.43 1.33-1.97 1.37-.5.05-.98.23-3.3-.69-2.8-1.1-4.57-3.97-4.71-4.15-.14-.18-1.13-1.5-1.13-2.87s.72-2.04.97-2.32c.26-.28.56-.35.75-.35l.54.01c.17.01.41-.07.64.49.24.57.8 1.96.87 2.1.07.14.12.3.02.49-.09.18-.14.3-.28.46-.14.16-.29.36-.42.49-.14.14-.28.29-.12.57.16.28.72 1.19 1.55 1.93 1.07.95 1.97 1.25 2.25 1.39.28.14.44.12.61-.07.16-.19.7-.82.89-1.1.19-.28.37-.23.63-.14.26.09 1.64.77 1.92.91.28.14.47.21.54.33.07.12.07.68-.17 1.36z"/></svg>
        </span>
        Написать в WhatsApp
      </a>
      <div class="phone-row">
        <span class="phone">+7 705 555 73 72</span>
        <button id="copy-btn" class="copy-btn" type="button">Скопировать</button>
      </div>
    </div>

    <p id="note" class="note hidden">Если WhatsApp не открылся, нажмите <span class="dots">⋯</span> в правом верхнем углу и выберите «Открыть в браузере».</p>
  </main>

<script>
(function () {
  var w = window.__wa;
  var waBtn = document.getElementById("wa-btn");
  var note = document.getElementById("note");

  if (w.isAndroid) waBtn.href = w.intent;
  else if (w.isIOS) waBtn.href = w.scheme;

  if (w.inApp && (w.isAndroid || w.isIOS)) {
    note.classList.remove("hidden");
  }

  var copyBtn = document.getElementById("copy-btn");
  var number = "+" + w.phone;
  function fallbackCopy() {
    var ta = document.createElement("textarea");
    ta.value = number;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, number.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function done() {
    copyBtn.textContent = "Скопировано";
    copyBtn.dataset.done = "true";
    setTimeout(function () { copyBtn.textContent = "Скопировать"; copyBtn.dataset.done = "false"; }, 2000);
  }
  copyBtn.addEventListener("click", function () {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(number).then(done, function () { if (fallbackCopy()) done(); });
    } else if (fallbackCopy()) { done(); }
  });
})();
</script>
</body>
</html>
